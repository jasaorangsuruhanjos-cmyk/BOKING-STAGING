name: Build JOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "jos-icon-*.png"
      - "resources/**"
      - "www/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare web directory
        run: test -f www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure native deep link callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='android:scheme="josapp"'
          if marker not in s:
              intent='''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="josapp" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              pos=s.find('</activity>')
              if pos < 0: raise SystemExit("MainActivity closing tag not found")
              s=s[:pos]+intent+s[pos:]
              import re
              m=re.search(r'<activity[^>]*android:name="\.MainActivity"[^>]*>',s)
              if m and 'android:launchMode=' not in m.group(0):
                  s=s[:m.end()-1]+' android:launchMode="singleTask"'+s[m.end()-1:]
              p.write_text(s)
          PY

      - name: Prepare proper JOS launcher and splash assets
        run: |
          mkdir -p assets
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageFile, ImageOps
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          src=Image.open('resources/jos-logo-source.jpg').convert('RGB')
          # Keep the complete original JOS logo visible; never stretch or crop it.
          def contain(canvas_size, bg, max_fraction):
              canvas=Image.new('RGBA',(canvas_size,canvas_size),bg)
              logo=src.copy()
              max_w=int(canvas_size*max_fraction)
              max_h=int(canvas_size*max_fraction)
              logo.thumbnail((max_w,max_h),Image.Resampling.LANCZOS)
              x=(canvas_size-logo.width)//2
              y=(canvas_size-logo.height)//2
              canvas.alpha_composite(logo.convert('RGBA'),(x,y))
              return canvas
          # Capacitor Assets uses these exact source filenames.
          contain(1024,(169,215,242,255),0.86).save('assets/icon-only.png')
          contain(1024,(169,215,242,255),0.86).save('assets/icon-foreground.png')
          Image.new('RGBA',(1024,1024),(169,215,242,255)).save('assets/icon-background.png')
          contain(2732,(255,255,255,255),0.76).save('assets/splash.png')
          contain(2732,(255,255,255,255),0.76).save('assets/splash-dark.png')
          PY
          npx capacitor-assets generate --android

      - name: Sync native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jos-pelanggan-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: JOS Pelanggan Android (Staging)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
