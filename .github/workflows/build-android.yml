name: Build JOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "jos-icon-*.png"
      - "resources/**"
      - "www/**"

permissions:
  contents: write

concurrency:
  group: jos-android-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Package customer website
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json service-worker.js jos-icon-192.png jos-icon-512.png www/

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure native deep link callback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='android:scheme="josapp"'
          if marker not in s:
              intent='''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="josapp" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              pos=s.find('</activity>')
              if pos < 0: raise SystemExit("MainActivity closing tag not found")
              s=s[:pos]+intent+s[pos:]
          activity=None
          for match in re.finditer(r'<activity[^>]*>',s):
              if 'MainActivity' in match.group(0):
                  activity=match
                  break
          if activity is None:
              raise SystemExit("MainActivity declaration not found")
          if 'android:launchMode=' not in activity.group(0):
              s=s[:activity.end()-1]+' android:launchMode="singleTask"'+s[activity.end()-1:]
          p.write_text(s)
          PY

      - name: Prepare the exact approved JOS logo for Android icon and splash
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          # Single source of truth: this is the exact 512x512 JOS artwork
          # previously approved by the owner for the Android app icon and splash.
          # Do not use resources/jos-logo-source.webp: it is an older, incorrect logo.
          source_path=Path('jos-icon-512.png')
          source=Image.open(source_path).convert('RGBA')
          source.load()
          if source.size != (512,512):
              raise SystemExit(f'Approved JOS logo must remain 512x512, got {source.size}')

          # Preserve the approved square artwork, including its complete margins.
          # No crop, redraw, recolor, retyping, or aspect-ratio change.
          icon=source.resize((1024,1024),Image.Resampling.LANCZOS)
          icon.save('assets/icon-only.png',format='PNG',optimize=True)

          # Adaptive icon: inset the complete square artwork so the technician,
          # wrench, roof, JOS lettering, and tagline remain inside the Android mask.
          foreground=Image.new('RGBA',(1024,1024),(0,0,0,0))
          mark=source.resize((760,760),Image.Resampling.LANCZOS)
          foreground.alpha_composite(mark,((1024-760)//2,(1024-760)//2))
          foreground.save('assets/icon-foreground.png',format='PNG',optimize=True)
          Image.new('RGBA',(1024,1024),(255,255,255,255)).save(
              'assets/icon-background.png',format='PNG',optimize=True)

          # Splash uses the same exact approved logo, centered on white.
          # Keep the complete square canvas; do not crop or enlarge past its bounds.
          splash=source.resize((2732,2732),Image.Resampling.LANCZOS)
          splash.save('assets/splash.png',format='PNG',optimize=True)
          splash.save('assets/splash-dark.png',format='PNG',optimize=True)

          # Verify that the image used is the approved repository icon itself.
          if source.size != (512,512) or splash.size != (2732,2732):
              raise SystemExit('JOS branding asset validation failed')
          print('Android icon and splash now use jos-icon-512.png (approved original).')
          print('Splash is square, white-background, full-frame, and uncropped.')
          PY
          npx capacitor-assets generate --android

      - name: Sync native project
        run: npx cap sync android

      - name: Force approved JOS launcher icons into Android resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          source=Image.open('assets/icon-only.png').convert('RGBA')
          foreground_source=Image.open('assets/icon-foreground.png').convert('RGBA')
          root=Path('android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=root/folder; d.mkdir(parents=True,exist_ok=True)
              icon=source.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
              fg=foreground_source.resize((size,size),Image.Resampling.LANCZOS)
              fg.save(d/'ic_launcher_foreground.png',optimize=True)
          values=root/'values'; values.mkdir(parents=True,exist_ok=True)
          (values/'jos_launcher_colors.xml').write_text(
              '<resources><color name="jos_launcher_background">#FFFFFF</color></resources>')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          start=text.find('<application')
          end=text.find('>',start)
          if start < 0 or end < 0: raise SystemExit("Android application tag not found")
          tag=text[start:end+1]
          tag=re.sub(r'android:icon="[^"]+"','',tag)
          tag=re.sub(r'android:roundIcon="[^"]+"','',tag)
          tag=tag[:-1]+' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          manifest.write_text(text[:start]+tag+text[end+1:])
          adaptive=root/'mipmap-anydpi-v26'; adaptive.mkdir(parents=True,exist_ok=True)
          xml='''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/jos_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'''
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          print("Android manifest points to the approved JOS launcher assets.")
          PY

      - name: Verify generated Android branding assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          root=Path('android/app/src/main/res')
          candidates=list(root.glob('mipmap*/ic_launcher*.png'))+list(root.glob('drawable*/splash*.png'))
          if not candidates:
              raise SystemExit("No generated launcher/splash assets found")
          for p in candidates:
              im=Image.open(p).convert('RGBA')
              im.load()
              if im.width < 24 or im.height < 24:
                  raise SystemExit(f"Generated asset invalid: {p} {im.size}")
          if not (root/'mipmap-mdpi/ic_launcher.png').exists():
              raise SystemExit("Launcher icon missing")
          print(f"Verified {len(candidates)} Android launcher/splash PNG assets")
          PY

      - name: Verify packaged web app
        run: |
          test -s www/index.html
          grep -q "Jasa Orang Suruhan" www/index.html
          test "$(wc -c < www/index.html)" -gt 500000

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Inspect APK package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jos-pelanggan-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: JOS Pelanggan Android (Staging)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
