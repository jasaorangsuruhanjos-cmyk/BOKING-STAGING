name: Build JOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "jos-icon-*.png"
      - "resources/**"
      - "www/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Package actual JOS customer web app
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json service-worker.js jos-icon-192.png jos-icon-512.png www/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          html=p.read_text(encoding="utf-8")
          script=r"""
          <script id="jos-native-splash-dismiss">
          (function(){
            const cap=window.Capacitor;
            if(!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
            let done=false;
            async function dismiss(){
              if(done)return;
              done=true;
              try{
                const splash=cap.Plugins && cap.Plugins.SplashScreen;
                if(splash && splash.hide) await splash.hide({fadeOutDuration:250});
              }catch(error){console.warn('JOS splash hide:',error);}
            }
            window.addEventListener('load',function(){setTimeout(dismiss,350);},{once:true});
            document.addEventListener('DOMContentLoaded',function(){setTimeout(dismiss,700);},{once:true});
            setTimeout(dismiss,9000);
          })();
          </script>
          """
          if 'jos-native-splash-dismiss' not in html:
              html += "\n" + script + "\n"
          p.write_text(html,encoding="utf-8")
          if p.stat().st_size < 500000:
              raise SystemExit("Bundled customer app unexpectedly small; refusing empty/placeholder web bundle.")
          PY

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure native deep link callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='android:scheme="josapp"'
          if marker not in s:
              intent='''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="josapp" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              pos=s.find('</activity>')
              if pos < 0: raise SystemExit("MainActivity closing tag not found")
              s=s[:pos]+intent+s[pos:]
          activity=None
          for match in re.finditer(r'<activity[^>]*>',s):
              if 'MainActivity' in match.group(0):
                  activity=match
                  break
          if activity is None:
              raise SystemExit("MainActivity declaration not found")
          if 'android:launchMode=' not in activity.group(0):
              s=s[:activity.end()-1]+' android:launchMode="singleTask"'+s[activity.end()-1:]
          p.write_text(s)
          PY

      - name: Prepare verified JOS launcher and splash assets
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Image.open('resources/jos-logo-source.jpg').convert('RGB')
          source.load()  # Fail if the uploaded source image is incomplete or corrupt.
          if source.size not in ((256,256),(512,512),(1024,1024)):
              raise SystemExit(f"Unexpected source logo dimensions: {source.size}")
          source=source.resize((1024,1024),Image.Resampling.LANCZOS)
          # Full original logo artwork for legacy launcher icons.
          source.save('assets/icon-only.png',format='PNG',optimize=True)
          # Adaptive icon: keep the full JOS artwork centered with safe mask margins.
          foreground=Image.new('RGBA',(1024,1024),(0,0,0,0))
          fg=source.copy()
          fg.thumbnail((820,820),Image.Resampling.LANCZOS)
          foreground.alpha_composite(fg.convert('RGBA'),((1024-fg.width)//2,(1024-fg.height)//2))
          foreground.save('assets/icon-foreground.png',format='PNG',optimize=True)
          Image.new('RGBA',(1024,1024),(169,215,242,255)).save('assets/icon-background.png',format='PNG',optimize=True)
          splash=Image.new('RGBA',(2732,2732),(255,255,255,255))
          logo=source.copy()
          logo.thumbnail((2050,2050),Image.Resampling.LANCZOS)
          splash.alpha_composite(logo.convert('RGBA'),((2732-logo.width)//2,(2732-logo.height)//2))
          splash.save('assets/splash.png',format='PNG',optimize=True)
          splash.save('assets/splash-dark.png',format='PNG',optimize=True)
          print('JOS source verified:',source.size)
          PY
          npx capacitor-assets generate --android

      - name: Verify generated Android branding assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('android/app/src/main/res')
          candidates=list(root.glob('mipmap*/ic_launcher*.png'))+list(root.glob('drawable*/splash*.png'))
          if not candidates:
              raise SystemExit("No generated launcher/splash assets found")
          for p in candidates:
              im=Image.open(p).convert('RGBA')
              im.load()
              if im.width < 48 or im.height < 48:
                  raise SystemExit(f"Generated asset too small: {p} {im.size}")
          print(f"Verified {len(candidates)} Android launcher/splash PNG assets")
          PY

      - name: Sync native project
        run: npx cap sync android

      - name: Verify packaged web app
        run: |
          test -s www/index.html
          grep -q "Jasa Orang Suruhan" www/index.html
          grep -q "jos-native-splash-dismiss" www/index.html
          test "$(wc -c < www/index.html)" -gt 500000

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Inspect APK package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jos-pelanggan-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: JOS Pelanggan Android (Staging)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
