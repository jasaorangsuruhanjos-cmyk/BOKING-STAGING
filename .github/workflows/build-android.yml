name: Build JOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "jos-icon-*.png"
      - "resources/**"
      - "www/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Package JOS customer app with one fullscreen launch screen
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json service-worker.js jos-icon-192.png jos-icon-512.png www/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("www/index.html")
          html=p.read_text(encoding="utf-8")
          if "jos-app-launch-screen" not in html:
              overlay = """
          <style id="jos-app-launch-style">
          html,body{background:#a9d7f2}
          #jos-app-launch-screen{position:fixed;inset:0;width:100%;height:100%;height:100dvh;z-index:2147483647;background:#a9d7f2 url('jos-launch-screen.jpg') center center/100% 100% no-repeat;opacity:1;visibility:visible;transition:opacity .28s ease}
          #jos-app-launch-screen.jos-launch-hide{opacity:0;pointer-events:none}
          </style>
          <div id="jos-app-launch-screen" role="img" aria-label="JOS Jasa Orang Suruhan"></div>
          <script id="jos-app-launch-controller">
          (function(){
            var cap=window.Capacitor;
            var native=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform());
            if(!native){var e=document.getElementById('jos-app-launch-screen');if(e)e.remove();return;}
            var done=false;
            function hide(){
              if(done)return;done=true;
              var e=document.getElementById('jos-app-launch-screen');
              if(!e)return;
              e.classList.add('jos-launch-hide');
              setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);},320);
            }
            window.addEventListener('load',function(){setTimeout(hide,850);},{once:true});
            setTimeout(hide,9000);
          })();
          </script>
          """
              m=re.search(r'<body[^>]*>',html,re.I)
              if not m: raise SystemExit("BODY tag not found for native splash injection")
              html=html[:m.end()]+"\n"+overlay+"\n"+html[m.end():]
          if html.count('id="jos-app-launch-screen"') != 1:
              raise SystemExit("Expected exactly one JOS launch screen")
          p.write_text(html,encoding="utf-8")
          if p.stat().st_size < 500000:
              raise SystemExit("Bundled customer app unexpectedly small.")
          PY

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure native deep link callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='android:scheme="josapp"'
          if marker not in s:
              intent='''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="josapp" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              pos=s.find('</activity>')
              if pos < 0: raise SystemExit("MainActivity closing tag not found")
              s=s[:pos]+intent+s[pos:]
          activity=None
          for match in re.finditer(r'<activity[^>]*>',s):
              if 'MainActivity' in match.group(0):
                  activity=match
                  break
          if activity is None:
              raise SystemExit("MainActivity declaration not found")
          if 'android:launchMode=' not in activity.group(0):
              s=s[:activity.end()-1]+' android:launchMode="singleTask"'+s[activity.end()-1:]
          p.write_text(s)
          PY

      - name: Prepare exact JOS launcher and fullscreen splash assets
        run: |
          set -euo pipefail
          mkdir -p assets www
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Image.open('resources/jos-logo-source.jpg').convert('RGB')
          source.load()
          if source.size != (256,256):
              raise SystemExit(f"Unexpected JOS master logo dimensions: {source.size}")
          # Keep the supplied JOS artwork intact; do not auto-crop away its worker or wordmark.
          logo=source.resize((1024,1024),Image.Resampling.LANCZOS)
          # Full square launcher icon artwork.
          logo.save('assets/icon-only.png',format='PNG',optimize=True)
          fg=Image.new('RGBA',(1024,1024),(0,0,0,0))
          fg.alpha_composite(logo.convert('RGBA'),(0,0))
          fg.save('assets/icon-foreground.png',format='PNG',optimize=True)
          Image.new('RGBA',(1024,1024),(169,215,242,255)).save('assets/icon-background.png',format='PNG',optimize=True)
          # Native system splash uses the same blue brand colour, then hands off to the one
          # full-screen HTML launch artwork once the WebView is ready.
          splash=Image.new('RGBA',(2732,2732),(169,215,242,255))
          icon=logo.copy()
          icon.thumbnail((1700,1700),Image.Resampling.LANCZOS)
          splash.alpha_composite(icon.convert('RGBA'),((2732-icon.width)//2,(2732-icon.height)//2))
          splash.save('assets/splash.png',format='PNG',optimize=True)
          splash.save('assets/splash-dark.png',format='PNG',optimize=True)
          # Extend the logo's own horizontal background gradient edge-to-edge vertically.
          # The square artwork is placed at full screen width, without a visible tile or border.
          w,h=1080,2400
          strip=source.crop((0,0,source.width,3)).resize((w,1),Image.Resampling.LANCZOS)
          screen=Image.new('RGB',(w,h))
          for y in range(h):
              screen.paste(strip,(0,y))
          big=source.resize((w,w),Image.Resampling.LANCZOS)
          screen.paste(big,(0,(h-w)//2))
          screen.save('www/jos-launch-screen.jpg',format='JPEG',quality=94,optimize=True)
          print('Generated JOS launcher icon and 1080x2400 full-screen launch image from the exact repository JOS logo.')
          PY
          npx capacitor-assets generate --android

      - name: Sync native project
        run: npx cap sync android

      - name: Force JOS launcher icons into Android resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET
          source=Image.open('assets/icon-only.png').convert('RGBA')
          root=Path('android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=root/folder; d.mkdir(parents=True,exist_ok=True)
              icon=source.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
              fg=Image.new('RGBA',(size,size),(0,0,0,0))
              safe=source.copy()
              safe.thumbnail((int(size*.94),int(size*.94)),Image.Resampling.LANCZOS)
              fg.alpha_composite(safe,((size-safe.width)//2,(size-safe.height)//2))
              fg.save(d/'ic_launcher_foreground.png',optimize=True)
          values=root/'values'; values.mkdir(parents=True,exist_ok=True)
          colors=values/'jos_launcher_colors.xml'
          colors.write_text('''<resources><color name="jos_launcher_background">#A9D7F2</color></resources>''')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          import re
          app=re.search(r'<application\b[^>]*>',text)
          if not app: raise SystemExit("Android application tag not found")
          tag=app.group(0)
          tag=re.sub(r'android:icon="[^"]+"','',tag)
          tag=re.sub(r'android:roundIcon="[^"]+"','',tag)
          tag=tag[:-1]+' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          text=text[:app.start()]+tag+text[app.end():]
          manifest.write_text(text)
          print("Android application manifest explicitly points to the JOS launcher icons")
          adaptive=root/'mipmap-anydpi-v26'; adaptive.mkdir(parents=True,exist_ok=True)
          xml='''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/jos_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'''
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          print('Forced JOS icons for legacy and adaptive Android launcher resources')
          PY

      - name: Verify generated Android branding assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('android/app/src/main/res')
          candidates=list(root.glob('mipmap*/ic_launcher*.png'))+list(root.glob('drawable*/splash*.png'))
          if not candidates:
              raise SystemExit("No generated launcher/splash assets found")
          for p in candidates:
              im=Image.open(p).convert('RGBA')
              im.load()
              if im.width < 24 or im.height < 24:
                  raise SystemExit(f"Generated asset invalid: {p} {im.size}")
          print(f"Verified {len(candidates)} Android launcher/splash PNG assets")
          PY

      - name: Verify packaged web app
        run: |
          test -s www/index.html
          grep -q "Jasa Orang Suruhan" www/index.html
          test "$(wc -c < www/index.html)" -gt 500000

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Inspect APK package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jos-pelanggan-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: JOS Pelanggan Android (Staging)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
