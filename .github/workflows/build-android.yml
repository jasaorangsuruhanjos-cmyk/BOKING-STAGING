name: Build JOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "jos-icon-*.png"
      - "resources/**"
      - "www/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Package customer website without duplicate splash overlays
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json service-worker.js jos-icon-192.png jos-icon-512.png www/

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure native deep link callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='android:scheme="josapp"'
          if marker not in s:
              intent='''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="josapp" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              pos=s.find('</activity>')
              if pos < 0: raise SystemExit("MainActivity closing tag not found")
              s=s[:pos]+intent+s[pos:]
          activity=None
          for match in re.finditer(r'<activity[^>]*>',s):
              if 'MainActivity' in match.group(0):
                  activity=match
                  break
          if activity is None:
              raise SystemExit("MainActivity declaration not found")
          if 'android:launchMode=' not in activity.group(0):
              s=s[:activity.end()-1]+' android:launchMode="singleTask"'+s[activity.end()-1:]
          p.write_text(s)
          PY

      - name: Prepare centered JOS icon and ONE native splash screen
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 -m pip install --quiet Pillow CairoSVG
          python3 - <<'PY'
          from PIL import Image, ImageFilter
          import cairosvg
          # Render the approved vector master at high resolution so the Android
          # splash is crisp; no low-resolution raster logo is enlarged.
          cairosvg.svg2png(url='resources/jos-logo-hd.svg',
                           write_to='assets/jos-logo-hd.png',
                           output_width=2400, output_height=2400)
          source=Image.open('assets/jos-logo-hd.png').convert('RGBA')
          source.load()
          if source.size != (2400,2400):
              raise SystemExit(f'Unexpected JOS vector render dimensions: {source.size}')
          blue=(169,215,242,255)
          # Keep the whole original JOS artwork inside Android's adaptive-icon safe zone.
          # Full-bleed (1024px) is clipped by launcher's circular/squircle mask; 660px
          # looked too small. 660px keeps all artwork inside the adaptive-icon mask safe area.
          icon=Image.new('RGBA',(1024,1024),blue)
          # Use the full-resolution vector render directly for splash generation.
          master=source.filter(ImageFilter.UnsharpMask(radius=1.2,percent=45,threshold=3))
          mark=master.resize((660,660),Image.Resampling.LANCZOS)
          mark=mark.filter(ImageFilter.UnsharpMask(radius=1.1,percent=70,threshold=2))
          icon.alpha_composite(mark,((1024-mark.width)//2,(1024-mark.height)//2))
          icon.save('assets/icon-only.png',format='PNG',optimize=True)
          # Transparent foreground with same scale: no extra inset is added downstream.
          foreground=Image.new('RGBA',(1024,1024),(0,0,0,0))
          foreground.alpha_composite(mark,((1024-mark.width)//2,(1024-mark.height)//2))
          foreground.save('assets/icon-foreground.png',format='PNG',optimize=True)
          Image.new('RGBA',(1024,1024),blue).save('assets/icon-background.png',format='PNG',optimize=True)
          bbox=foreground.getbbox()
          if not bbox or bbox[0] < 95 or bbox[1] < 95 or bbox[2] > 929 or bbox[3] > 929:
              raise SystemExit(f'JOS foreground escaped safe zone: {bbox}')
          print(f'Launcher artwork safely centered at {mark.size}, alpha bounds {bbox}.')
          # Single Android system splash: one blue canvas and one centered, uncropped logo.
          splash=Image.new('RGBA',(2732,2732),blue)
          # Use the full-resolution 2400px vector render for the splash; preserve every edge.
          mark=master.copy()
          mark.thumbnail((1900,1900),Image.Resampling.LANCZOS)
          mark=mark.filter(ImageFilter.UnsharpMask(radius=1.5,percent=90,threshold=2))
          splash.alpha_composite(mark,((2732-mark.width)//2,(2732-mark.height)//2))
          splash.save('assets/splash.png',format='PNG',optimize=True)
          splash.save('assets/splash-dark.png',format='PNG',optimize=True)
          print('Created centered safe-area launcher icon and one native splash image.')
          PY
          npx capacitor-assets generate --android

      - name: Sync native project
        run: npx cap sync android

      - name: Force JOS launcher icons into Android resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET
          import re
          source=Image.open('assets/icon-only.png').convert('RGBA')
          foreground_source=Image.open('assets/icon-foreground.png').convert('RGBA')
          root=Path('android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=root/folder; d.mkdir(parents=True,exist_ok=True)
              icon=source.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
              # Keep the foreground artwork full-size; do not add a second inset.
              fg=foreground_source.resize((size,size),Image.Resampling.LANCZOS)
              fg.save(d/'ic_launcher_foreground.png',optimize=True)
          values=root/'values'; values.mkdir(parents=True,exist_ok=True)
          colors=values/'jos_launcher_colors.xml'
          colors.write_text('''<resources><color name="jos_launcher_background">#A9D7F2</color></resources>''')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          start=text.find('<application')
          end=text.find('>',start)
          if start < 0 or end < 0: raise SystemExit("Android application tag not found")
          tag=text[start:end+1]
          tag=re.sub(r'android:icon="[^"]+"','',tag)
          tag=re.sub(r'android:roundIcon="[^"]+"','',tag)
          tag=tag[:-1]+' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          manifest.write_text(text[:start]+tag+text[end+1:])
          print("Android application manifest explicitly points to the JOS launcher icons")
          adaptive=root/'mipmap-anydpi-v26'; adaptive.mkdir(parents=True,exist_ok=True)
          xml='''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/jos_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'''
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          print('Forced JOS icons for legacy and adaptive Android launcher resources')
          PY

      - name: Verify generated Android branding assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('android/app/src/main/res')
          candidates=list(root.glob('mipmap*/ic_launcher*.png'))+list(root.glob('drawable*/splash*.png'))
          if not candidates:
              raise SystemExit("No generated launcher/splash assets found")
          for p in candidates:
              im=Image.open(p).convert('RGBA')
              im.load()
              if im.width < 24 or im.height < 24:
                  raise SystemExit(f"Generated asset invalid: {p} {im.size}")
          print(f"Verified {len(candidates)} Android launcher/splash PNG assets")
          PY

      - name: Verify packaged web app
        run: |
          test -s www/index.html
          grep -q "Jasa Orang Suruhan" www/index.html
          test "$(wc -c < www/index.html)" -gt 500000

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Inspect APK package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jos-pelanggan-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: JOS Pelanggan Android (Staging)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
