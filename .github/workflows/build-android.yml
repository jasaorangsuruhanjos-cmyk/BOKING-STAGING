name: Build JOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "jos-icon-*.png"
      - "resources/**"
      - "www/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Package actual JOS customer web app
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json service-worker.js jos-icon-192.png jos-icon-512.png www/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          html=p.read_text(encoding="utf-8")
          overlay=r"""
          <style id="jos-native-fullscreen-splash-style">
          #jos-native-fullscreen-splash{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,#c9edfa 0%,#a9d7f2 48%,#78b6e8 100%);opacity:1;transition:opacity .4s ease}
          #jos-native-fullscreen-splash img{display:block;width:92vw;max-width:720px;max-height:68vh;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(7,46,105,.12))}
          #jos-native-fullscreen-splash.jos-fade{opacity:0;pointer-events:none}
          @media(prefers-reduced-motion:reduce){#jos-native-fullscreen-splash{transition:none}}
          </style>
          <div id="jos-native-fullscreen-splash" aria-label="JOS Jasa Orang Suruhan">
            <img src="jos-native-splash.png" alt="JOS Jasa Orang Suruhan">
          </div>
          <script id="jos-native-splash-dismiss">
          (function(){
            const cap=window.Capacitor;
            const native=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform());
            if(!native)return;
            const overlay=document.getElementById('jos-native-fullscreen-splash');
            if(overlay)overlay.style.display='flex';
            let done=false;
            async function dismiss(){
              if(done)return;done=true;
              if(overlay){overlay.classList.add('jos-fade');setTimeout(()=>overlay.remove(),450);}
              try{const splash=cap.Plugins&&cap.Plugins.SplashScreen;if(splash&&splash.hide)await splash.hide({fadeOutDuration:350});}catch(error){console.warn('JOS native splash:',error);}
            }
            window.addEventListener('load',()=>setTimeout(dismiss,2200),{once:true});
            setTimeout(dismiss,10000);
          })();
          </script>
          """
          if 'jos-native-fullscreen-splash' not in html:
              if '</body>' in html:
                  html=html.replace('</body>',overlay+'\n</body>',1)
              else:
                  html += overlay
          p.write_text(html,encoding="utf-8")
          if p.stat().st_size < 500000:
              raise SystemExit("Bundled customer app unexpectedly small; refusing empty/placeholder web bundle.")
          PY

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure native deep link callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='android:scheme="josapp"'
          if marker not in s:
              intent='''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="josapp" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              pos=s.find('</activity>')
              if pos < 0: raise SystemExit("MainActivity closing tag not found")
              s=s[:pos]+intent+s[pos:]
          activity=None
          for match in re.finditer(r'<activity[^>]*>',s):
              if 'MainActivity' in match.group(0):
                  activity=match
                  break
          if activity is None:
              raise SystemExit("MainActivity declaration not found")
          if 'android:launchMode=' not in activity.group(0):
              s=s[:activity.end()-1]+' android:launchMode="singleTask"'+s[activity.end()-1:]
          p.write_text(s)
          PY

      - name: Prepare verified JOS launcher and splash assets
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 -m pip install --quiet Pillow numpy
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Image.open('resources/jos-logo-source.jpg').convert('RGB')
          source.load()  # Fail if the uploaded source image is incomplete or corrupt.
          if source.size not in ((256,256),(512,512),(1024,1024)):
              raise SystemExit(f"Unexpected source logo dimensions: {source.size}")
          source=source.resize((1024,1024),Image.Resampling.LANCZOS)
          # Keep the full JOS wordmark large and centered. Use one full-bleed brand colour.
          import numpy as np
          source=Image.open('resources/jos-logo-source.jpg').convert('RGB')
          arr=np.asarray(source)
          # Crop plain background margins so the JOS worker, roof and wordmark occupy the screen.
          corner=np.concatenate([arr[:12,:12].reshape(-1,3),arr[:12,-12:].reshape(-1,3),arr[-12:,:12].reshape(-1,3),arr[-12:,-12:].reshape(-1,3)])
          bg=np.median(corner,axis=0)
          mask=np.max(np.abs(arr.astype('int16')-bg.astype('int16')),axis=2)>28
          ys,xs=np.where(mask)
          if len(xs)>20:
              pad=max(3,int(max(xs.max()-xs.min(),ys.max()-ys.min())*.06))
              box=(max(0,int(xs.min())-pad),max(0,int(ys.min())-pad),min(source.width,int(xs.max())+pad+1),min(source.height,int(ys.max())+pad+1))
              logo=source.crop(box)
          else:
              logo=source.copy()
          # A clean square launcher canvas, using the JOS light-blue brand background.
          icon=Image.new('RGB',(1024,1024),(169,215,242))
          icon_logo=logo.copy()
          icon_logo.thumbnail((960,960),Image.Resampling.LANCZOS)
          icon.paste(icon_logo,((1024-icon_logo.width)//2,(1024-icon_logo.height)//2))
          icon.save('assets/icon-only.png',format='PNG',optimize=True)
          foreground=Image.new('RGBA',(1024,1024),(0,0,0,0))
          fg=logo.copy()
          fg.thumbnail((760,760),Image.Resampling.LANCZOS)
          foreground.alpha_composite(fg.convert('RGBA'),((1024-fg.width)//2,(1024-fg.height)//2))
          foreground.save('assets/icon-foreground.png',format='PNG',optimize=True)
          Image.new('RGBA',(1024,1024),(169,215,242,255)).save('assets/icon-background.png',format='PNG',optimize=True)
          # Native splash artwork uses full-bleed brand colour; logo is oversized and centered.
          splash=Image.new('RGBA',(2732,2732),(169,215,242,255))
          splash_logo=logo.copy()
          splash_logo.thumbnail((2580,2580),Image.Resampling.LANCZOS)
          splash.alpha_composite(splash_logo.convert('RGBA'),((2732-splash_logo.width)//2,(2732-splash_logo.height)//2))
          splash.save('assets/splash.png',format='PNG',optimize=True)
          splash.save('assets/splash-dark.png',format='PNG',optimize=True)
          # Full-screen 9:16 launch image. The logo fills most of the screen width.
          screen=Image.new('RGB',(1080,1920),(169,215,242))
          screen_logo=logo.copy()
          screen_logo.thumbnail((1040,1160),Image.Resampling.LANCZOS)
          screen.paste(screen_logo,((1080-screen_logo.width)//2,(1920-screen_logo.height)//2))
          screen.save('www/jos-native-splash.png',format='PNG',optimize=True)
          print('JOS full-screen splash generated; tight artwork crop:',logo.size)
          PY
          npx capacitor-assets generate --android

      - name: Force JOS launcher icons into Android resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET
          source=Image.open('assets/icon-only.png').convert('RGBA')
          root=Path('android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=root/folder; d.mkdir(parents=True,exist_ok=True)
              icon=source.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
              fg=Image.new('RGBA',(size,size),(0,0,0,0))
              safe=source.copy()
              safe.thumbnail((int(size*.72),int(size*.72)),Image.Resampling.LANCZOS)
              fg.alpha_composite(safe,((size-safe.width)//2,(size-safe.height)//2))
              fg.save(d/'ic_launcher_foreground.png',optimize=True)
          values=root/'values'; values.mkdir(parents=True,exist_ok=True)
          colors=values/'jos_launcher_colors.xml'
          colors.write_text('''<resources><color name="jos_launcher_background">#A9D7F2</color></resources>''')
          adaptive=root/'mipmap-anydpi-v26'; adaptive.mkdir(parents=True,exist_ok=True)
          xml='''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/jos_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'''
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          print('Forced JOS icons for legacy and adaptive Android launcher resources')
          PY

      - name: Verify generated Android branding assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('android/app/src/main/res')
          candidates=list(root.glob('mipmap*/ic_launcher*.png'))+list(root.glob('drawable*/splash*.png'))
          if not candidates:
              raise SystemExit("No generated launcher/splash assets found")
          for p in candidates:
              im=Image.open(p).convert('RGBA')
              im.load()
              if im.width < 24 or im.height < 24:
                  raise SystemExit(f"Generated asset invalid: {p} {im.size}")
          print(f"Verified {len(candidates)} Android launcher/splash PNG assets")
          PY

      - name: Sync native project
        run: npx cap sync android

      - name: Verify packaged web app
        run: |
          test -s www/index.html
          grep -q "Jasa Orang Suruhan" www/index.html
          grep -q "jos-native-splash-dismiss" www/index.html
          test "$(wc -c < www/index.html)" -gt 500000

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Inspect APK package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jos-pelanggan-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: JOS Pelanggan Android (Staging)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
